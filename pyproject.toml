[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timbre"
version = "0.1.0"
description = "Timbre — a voice-emotion-aware companion bot (perception-layer ML course project)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "librosa>=0.10",
    "hmmlearn>=0.3",
    "soundfile>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "joblib>=1.3",
    "openai>=1.30",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "matplotlib>=3.8",
]
transfer = [
    "torch>=2.6,<3",
    "torchaudio>=2.6,<3",
]

[project.scripts]
timbre-download = "ml.data.download:main"
timbre-prepare = "ml.data.prepare:main"
timbre-extract = "ml.training.extract_features:main"
timbre-extract-augmented = "ml.training.extract_augmented:main"
timbre-split = "ml.data.prepare:main"
timbre-verify-data = "ml.data.verify:main"
timbre-train-baselines = "ml.training.train_baselines:main"
timbre-train = "ml.training.train:main"
timbre-calibrate = "ml.training.calibrate:main"
timbre-evaluate = "ml.training.evaluate:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["timbre*", "scripts*", "ml*"]
namespaces = false

[tool.setuptools.package-data]
"timbre" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
